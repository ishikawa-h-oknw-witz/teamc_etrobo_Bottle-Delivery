INCLUDE("tecsgen.cfg");

#include "app.h"

// メインタスクを生成（OS起動時に自動実行）
CRE_TSK(
    MAIN_TASK,          // タスクID
    {
        TA_ACT,         // タスク属性（自動起動）
        0,              // 拡張情報（未使用）
        main_task,      // タスク関数
        MAIN_PRIORITY,  // タスク優先度
        STACK_SIZE,     // スタックサイズ
        NULL            // スタック領域（OSが自動確保）
    }
);

